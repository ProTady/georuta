name: geo_ruta
description: "GeoRuta - App de compra anticipada de viajes Sayán-Huacho."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.6.2

  # HTTP client
  dio: ^5.7.0

  # Secure storage for JWT tokens
  flutter_secure_storage: ^9.2.2

  # Maps (OpenStreetMap, free alternative to Google Maps)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Misc
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
